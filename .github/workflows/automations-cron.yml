name: Automatizaciones (cron horario)

# El disparo horario de las automatizaciones programadas vive AQUÍ, no en
# vercel.json: el plan de Vercel es Hobby, donde los cron jobs se ejecutan una sola
# vez al día — un `"schedule": "0 * * * *"` allí no haría lo que dice.
#
# El endpoint decide qué toca según la hora de Bogotá y su propia idempotencia
# (AutomationRun), así que un disparo de más es inofensivo y uno de menos se
# recupera en el siguiente. Por eso basta un job horario para las 6 programadas.
#
# AL PASAR A PRO: retirar este workflow y descomentar en vercel.json:
#   "crons": [{ "path": "/api/cron/automations", "schedule": "0 * * * *" }]
# Vercel Cron manda el header Authorization con el CRON_SECRET del proyecto, así
# que el handler no cambia. (vercel.json es JSON estricto y no admite comentarios,
# por eso el bloque vive documentado aquí y en CLAUDE.md, no comentado allá.)

on:
  schedule:
    # Cada hora en punto, UTC. GitHub Actions siempre programa en UTC; la
    # conversión a hora de Bogotá la hace el motor (lib/timezone.zonedHour), que es
    # el único lugar del código que conoce el huso.
    - cron: '0 * * * *'
  # Permite dispararlo a mano desde la pestaña Actions para probar un barrido.
  workflow_dispatch:

# Sin permisos sobre el repo: este job sólo hace una petición HTTP saliente.
permissions: {}

concurrency:
  # Si un barrido se demora más de una hora, el siguiente espera en vez de
  # solaparse. La idempotencia ya protege contra el duplicado, pero dos barridos
  # simultáneos sólo malgastan conexiones a la DB.
  group: automations-cron
  cancel-in-progress: false

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/automations
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_URL: ${{ vars.CRON_URL }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Falta el secret CRON_SECRET (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # URL de producción del deploy: variable del repo (Settings → Secrets and
          # variables → Actions → Variables), p. ej. https://<tu-dominio>/api/cron/automations.
          # SIN fallback a un dominio incrustado: un fork que la olvide debe FALLAR ruidoso,
          # no pegarle al cron de OTRO deploy (antes caía a nayoli-demo, un ping al ajeno).
          if [ -z "${CRON_URL}" ]; then
            echo "::error::Falta la variable CRON_URL (Settings → Secrets and variables → Actions → Variables). Apúntala a https://<tu-dominio>/api/cron/automations."
            exit 1
          fi
          URL="${CRON_URL}"

          echo "POST ${URL}"
          # --fail-with-body: un 4xx/5xx falla el job PERO imprime el cuerpo, que es
          # donde viene el motivo (401 secreto malo, 503 env sin configurar).
          curl --silent --show-error --fail-with-body \
               --max-time 300 \
               --retry 2 --retry-delay 30 --retry-connrefused \
               -X POST "${URL}" \
               -H "Authorization: Bearer ${CRON_SECRET}" \
               -H "Content-Type: application/json" \
            | tee respuesta.json

          echo ""

          # QUIÉN respondió, no sólo QUÉ hizo (CRON-CONTRA-QUE-DEPLOYMENT-1). Si CRON_URL
          # apunta a un deployment VIVO pero equivocado (uno viejo, un preview), el endpoint
          # responde 200 y este job se pondría en verde igual — es el mismo modo de falla
          # que esta misma semana dejó cobrando a un webhook mal apuntado, sin que nada lo
          # avisara. "null" (ENTORNO/COMMIT ausentes de la respuesta, o `jq` sin poder leer
          # el JSON) NO cuenta como producción: se trata igual que un entorno equivocado,
          # abajo — no hay forma de VERIFICAR que respondió producción, así que no se asume.
          ENTORNO=$(jq -r '.deployment.entorno // "null"' respuesta.json 2>/dev/null || echo "null")
          COMMIT=$(jq -r '.deployment.commit // "null"' respuesta.json 2>/dev/null || echo "null")

          echo "### Barrido de automatizaciones" >> "$GITHUB_STEP_SUMMARY"
          echo "**Deployment:** entorno=\`${ENTORNO}\` · commit=\`${COMMIT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat respuesta.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if [ "${ENTORNO}" != "production" ]; then
            echo "::error::El barrido respondió desde el entorno '${ENTORNO}' (commit ${COMMIT}), no 'production'. CRON_URL apunta a un deployment que no es la producción real — el mismo defecto que esta semana dejó cobrando a un webhook mal apuntado, sin que nada lo avisara. Corregí la variable CRON_URL (Settings → Secrets and variables → Actions → Variables) para que apunte al dominio de PRODUCCIÓN."
            exit 1
          fi
